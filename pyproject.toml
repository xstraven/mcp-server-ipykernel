[project]
name = "ipymcp"
version = "0.1.0"
description = "MCP server for Jupyter kernel introspection"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "jupyter-client>=8.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
ipymcp = "ipymcp.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipymcp"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
